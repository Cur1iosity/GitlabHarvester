# GitlabHarvester configuration example.
#
# Usage:
#   cp config.example.ini config.ini        # config.ini is git-ignored
#   gitlab-harvester -c config.ini
#   gitlab-harvester -c config.ini --forks skip -s token   # CLI arguments override the file
#
# Rules:
# - Keys are the long command-line option names (index-branches == --index-branches).
#   Sections only group keys; a key may appear once per file.
# - An empty value means "not set": the built-in default (or the CLI argument) applies.
# - Comments must be on their own line: text after a value is part of the value.
# - Precedence: command-line argument > this file > built-in default.
#   For on/off options, the CLI can switch a value from this file off: --no-resume,
#   --no-dump-projects, --no-debug, --no-sort-keys, --no-normalize-hits.
# - Relative paths are resolved against the directory of this file.

[connection]
# GitLab base URL, e.g. https://gitlab.example.com (required for search and dump-index).
url =
# Personal access token with the read_api scope (required for search and dump-index).
# Keep this file private. To avoid storing the token here, use env:VARIABLE,
# e.g. "token = env:GITLAB_TOKEN" reads it from the GITLAB_TOKEN environment variable.
token =
# Optional HTTP(S) proxy for API traffic, e.g. http://127.0.0.1:8080 (scheme added if missing).
proxy =
# Timeout of one API request, in seconds (integer). Default: 60.
timeout = 60
# Parallel API requests: 1..64. Default: 1 (sequential).
# More workers speed up project listing, branch listing and search, but multiply
# the request rate: use it only if the instance has no API rate limits
# (HTTP 429 responses are retried according to Retry-After).
workers = 1

[logging]
# Console log level: ERROR | WARN | INFO. Default: WARN.
log-level = WARN
# Debug logging, overrides log-level: true | false. Default: false.
debug = false
# Also write logs to this file (optional).
log-file =

[run]
# What to do: search | dump-index | dedup | convert. Default: search.
#   search      build/reuse the project index, then search the terms
#   dump-index  (re)build the project index only
#   dedup       remove duplicate hits from a session file (see [postprocess])
#   convert     convert a session JSONL file to a JSON array (see [postprocess])
mode = search

[index]
# Instance Project Index file (JSONL). Empty = <host>_project_index.jsonl in the current directory.
index-file =
# Rebuild the index even if the file exists: true | false. Default: false.
# Needed after changing index-branches, because an existing index is reused as is.
dump-projects = false
# Page size for project listing, 1..100 (GitLab caps it at 100). Default: 100.
batch-size = 100
# Branches stored in the index: default | all | N (positive integer). Default: default.
#   default  only the default branch, no extra API calls (fast)
#   all      every branch of every non-empty project (one listing per project, slow)
#   N        up to N branches per project (GitLab lists them sorted by name)
index-branches =
# Page size for branch listing. Default: 100.
branches-per-page = 100

[search]
# Branches searched per project: default | all | N. Default: default.
#   Uses the branches stored in the index, so "all" needs index-branches = all (or N).
#   N always includes the default branch.
scan-branches =
# Shortcut that sets both index-branches and scan-branches: default | all | N.
# Explicit index-branches/scan-branches win over it.
branches =
# Fork strategy: include | skip | branch-diff | all-branches. Default: include.
#   include       forks are searched like regular projects
#   skip          forks are not searched at all
#   branch-diff   forks: default branch + fork-diff-bases + branches the upstream doesn't have
#   all-branches  forks: every indexed branch
forks = include
# Comma-separated branches always searched in forks with forks = branch-diff.
fork-diff-bases = main,master,develop,dev

# Search terms: use exactly one of search, terms-file or terms.
# A single term:
search =
# A file with one term per line (lines starting with # are comments):
terms-file =
# Or the terms right here, one per line (indent continuation lines):
terms =
    password
    api_key
    BEGIN RSA PRIVATE KEY

[time]
# Time filters. DATE is ISO 8601: 2024-06-01, 2024-06-01T12:00, 2024-06-01T12:00:00+03:00
# (without an offset it means UTC). Bounds are inclusive; an empty value means no limit.
#
# Shortcuts: set the same bound on all three levels below. A specific key wins over them.
time-after =
time-before =

# 1. Index build: GitLab lists only projects with activity (last_activity_at) in the window,
#    so fewer API pages are fetched. The index then holds only those projects; a later run
#    reuses it as is (with a warning if it asks for another window). Rebuild with dump-projects.
index-active-after =
index-active-before =

# 2. Search: projects of an existing index outside the window are skipped without API calls.
#    started-from is an alias of active-after (set only one of them).
#    GitLab updates last_activity_at at most once per hour, so keep a margin.
active-after =
active-before =

# 3. Files: keep only hits in files that a commit in that branch changed inside the window.
#    GitLab search has no date filter, so this costs one commits API request per file
#    with hits (cached across terms). If the check fails, the hits are kept.
file-changed-after =
file-changed-before =

[session]
# Where hits are written. Use at most one of session and session-file.
# Session name: creates <name>.jsonl in the current directory.
session =
# Explicit session file path (JSONL). Empty = results/<host>_session_<timestamp>.jsonl.
session-file =
# Continue an interrupted session: skip terms already completed in the session file.
# Requires the same session or session-file as the interrupted run. true | false. Default: false.
resume = false

[postprocess]
# Used by mode = dedup and mode = convert.
# Input session file and output file.
input-file =
output-file =
# dedup: SQLite file for seen hashes. Empty = <output-file>.seen.sqlite.
sqlite-path =
# dedup: hash algorithm: blake2b | sha1 | sha256. Default: blake2b.
hash-algo = blake2b
# dedup: collapse whitespace before comparing hits: true | false. Default: true.
normalize-hits = true
# convert: sort JSON keys in the output: true | false. Default: false.
sort-keys = false

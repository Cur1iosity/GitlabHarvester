# GitlabHarvester configuration example.
#
# Usage:
#   cp config.example.ini config.ini        # config.ini is git-ignored
#   gitlab-harvester -c config.ini
#   gitlab-harvester -c config.ini --forks skip -s token   # CLI arguments override the file
#
# Rules:
# - Keys are the long command-line option names (index-branches == --index-branches).
#   Sections only group keys; a key may appear once per file.
# - An empty value means "not set": the built-in default (or the CLI argument) applies.
# - Comments must be on their own line: text after a value is part of the value.
# - Precedence: command-line argument > this file > built-in default.
#   For on/off options, the CLI can switch a value from this file off: --no-resume,
#   --no-dump-projects, --no-debug, --no-sort-keys, --no-normalize-hits.
# - Relative paths are resolved against the directory of this file.

[connection]
# GitLab base URL, e.g. https://gitlab.example.com (required for search and dump-index).
url =
# Personal access token with the read_api scope (required for search and dump-index).
# Keep this file private. To avoid storing the token here, use env:VARIABLE,
# e.g. "token = env:GITLAB_TOKEN" reads it from the GITLAB_TOKEN environment variable.
# Several tokens separated by ';' run in parallel, each with its own workers (below)
# and its own rate-limit budget: token -> workers per token -> rpm per worker.
token =
# ...or a file with one token per line (# comments allowed), instead of token above.
# Each token runs in parallel, like several tokens in token. Set only one of the two.
token-file =
# Optional HTTP(S) proxy for API traffic, e.g. http://127.0.0.1:8080 (scheme added if missing).
proxy =
# Timeout of one API request, in seconds (integer). Default: 60.
timeout = 60
# TLS certificates are always verified. For a private CA, give its bundle (PEM file):
ca-bundle =
# Disable verification only if you accept the risk: the token is sent to an unverified
# server. It is never disabled automatically. true | false. Default: false.
insecure = false
# Parallel API requests per token: 1..64. Empty = 1 (sequential).
# More workers speed up project listing, branch listing and search, but multiply
# the request rate: use it only if the instance has no API rate limits
# (HTTP 429 responses are retried according to Retry-After).
# With several tokens the run keeps tokens x workers clients busy at once.
# auto-limits (below) chooses workers, index-rpm and search-rpm unless set here.
workers =
# Client-side request rate limits, in requests per minute PER WORKER (integer;
# empty or 0 = no limit). With workers = N the run sends up to N x rpm requests
# a minute. Requests are spaced evenly; retries after HTTP 429 count too.
# Use them to keep the traffic low or to stay under the instance's rate limits
# (GitLab limits the search API separately and usually much lower).
# Shortcut: set both limits below. A specific key wins over it.
rpm =
# Every API request except search: project and branch listing, file-change checks.
index-rpm =
# Search API requests (one per result page of a branch search).
search-rpm =
# Random delay before every API request, drawn anew for each one, so requests
# don't come at a fixed rhythm. MAX or MIN-MAX in seconds, or with ms/s:
# 0.03 (0-30 ms), 0.01-0.05, 10ms-50ms. Adds to the rpm spacing above, so the
# rate never exceeds the limits. Empty or 0 = off.
jitter =
# User-Agent of every API request. Default (empty): python-gitlab's own.
# Either one fixed string:
user-agent =
# or a file with one User-Agent per line (# comments allowed): every request gets
# one chosen at random. Set only one of the two.
user-agent-file =

[limits]
# EXPERIMENTAL: behavior, output and these keys may change in future releases.
# Measure the GitLab API rate limits before a search and offer --workers,
# index-rpm and search-rpm for them (asked on a terminal; elsewhere the command
# is printed and the run stops). Only the search API is measured when the project
# index already exists. During the search, HTTP 429 responses lead to a proposal
# of lower limits that does not stop the run (key L shows it again).
# Values set in this file or on the command line are kept. true | false. Default: false.
auto-limits = false
# APIs to measure: index, search or index,search. Empty: both with
# -m find-limits; with auto-limits search, plus index when the index must be built.
probe-apis =
# Most requests per measured API. The probe sends a default budget first
# (search 60, other API 300) and, without HTTP 429, goes deeper up to this
# number to find a higher limit or the real throughput. Default: 600.
probe-max = 600
# Share of a found limit the suggested settings use: 0.1..1 or 10%..100%. Default: 0.85.
probe-margin = 0.85

[logging]
# Console log level: ERROR | WARN | INFO. Default: WARN.
log-level = WARN
# Debug logging, overrides log-level: true | false. Default: false.
debug = false
# Also write logs to this file (optional). It also collects a summary of every run
# (options, index, search plan, per-term results, written files, duration), whatever
# log-level is; runs are appended, so the file keeps a history.
log-file =

[run]
# What to do: search | dump-index | find-limits | dedup | convert. Default: search.
#   search      build/reuse the project index, then search the terms
#   dump-index  (re)build the project index only
#   find-limits measure the API rate limits and print settings for them (see [limits];
#               experimental)
#   dedup       remove duplicate hits from a session file (see [postprocess])
#   convert     convert a session JSONL file to a JSON array (see [postprocess])
mode = search

[index]
# Instance Project Index file (JSONL). Empty = <host>_project_index.jsonl in the current directory.
index-file =
# Rebuild the index even if the file exists: true | false. Default: false.
# Needed after changing index-branches, because an existing index is reused as is.
dump-projects = false
# Page size for project listing, 1..100 (GitLab caps it at 100). Default: 100.
batch-size = 100
# Branches stored in the index: default | all | N (positive integer). Default: default.
#   default  only the default branch, no extra API calls (fast)
#   all      every branch of every non-empty project (one listing per project, slow)
#   N        up to N branches per project (GitLab lists them sorted by name)
index-branches =
# Page size for branch listing. Default: 100.
branches-per-page = 100

[search]
# Branches searched per project: default | all | N. Default: default.
#   Uses the branches stored in the index, so "all" needs index-branches = all (or N).
#   N always includes the default branch.
scan-branches =
# Shortcut that sets both index-branches and scan-branches: default | all | N.
# Explicit index-branches/scan-branches win over it.
branches =
# Fork strategy: include | skip | branch-diff | all-branches. Default: include.
#   include       forks are searched like regular projects
#   skip          forks are not searched at all
#   branch-diff   forks: default branch + fork-diff-bases + branches the upstream doesn't have
#   all-branches  forks: every indexed branch
forks = include
# Comma-separated branches always searched in forks with forks = branch-diff.
fork-diff-bases = main,master,develop,dev

# Search terms: use exactly one of search, terms-file or terms.
# A single term:
search =
# A file with one term per line (lines starting with # are comments):
terms-file =
# Or the terms right here, one per line (indent continuation lines):
terms =
    password
    api_key
    BEGIN RSA PRIVATE KEY

# File filters: search the terms only in some files. Case-insensitive; with both
# set, a file must match both. GitLab applies them on its side (filename: and
# extension: are added to the search string) and every result is re-checked.
# They narrow a search: the terms above are still needed. Empty = all files.
# File name: an exact name, which may include the extension (settings.py, .env,
# Dockerfile), or a mask where * matches any characters (*.env, config*,
# docker-compose*.yml, *secret*). A value with / matches the end of the path
# (config/*.yml). No spaces.
filename =
# Extension; the dot is optional: py, .py and *.py are the same.
extension =
# Without any term (search, terms-file, terms empty) the filters above collect every
# matching file instead: one hit per file, downloaded with download-files. The session
# term is the filter string (filename:*.env). How the files of a branch are found:
#   search  the search API with the filters only (where the search backend takes such
#           queries, e.g. advanced search)
#   tree    the repository tree: any GitLab, one request per 100 entries
#   auto    search, falling back to the tree (default)
file-listing = auto

# Search only indexed projects whose path (group/subgroup/project) matches one of
# these comma-separated patterns, case-insensitive. Without * a pattern is a
# substring (k8s matches infra/k8s-deploy and k8s/charts); with * it must match the
# whole path (infra/*, *-k8s). Works on the existing index, no extra API requests.
# Empty = every project.
project-filter =

[time]
# Time filters. DATE is ISO 8601: 2024-06-01, 2024-06-01T12:00, 2024-06-01T12:00:00+03:00
# (without an offset it means UTC). Bounds are inclusive; an empty value means no limit.
#
# Shortcuts: set the same bound on all three levels below. A specific key wins over them.
time-after =
time-before =

# 1. Index build: GitLab lists only projects with activity (last_activity_at) in the window,
#    so fewer API pages are fetched. The index then holds only those projects; a later run
#    reuses it as is (with a warning if it asks for another window). Rebuild with dump-projects.
index-active-after =
index-active-before =

# 2. Search: projects of an existing index outside the window are skipped without API calls.
#    started-from is an alias of active-after (set only one of them).
#    GitLab updates last_activity_at at most once per hour, so keep a margin.
active-after =
active-before =

# 3. Files: keep only hits in files that a commit in that branch changed inside the window.
#    GitLab search has no date filter, so this costs one commits API request per file
#    with hits (cached across terms). If the check fails, the hits are kept.
file-changed-after =
file-changed-before =

[session]
# Where hits are written. Use at most one of session and session-file.
# Session name: creates <name>.jsonl in the current directory.
session =
# Explicit session file path (JSONL). Empty = results/<host>_session_<timestamp>.jsonl.
session-file =
# Continue an interrupted session: skip terms already completed in the session file.
# Requires the same session or session-file as the interrupted run. true | false. Default: false.
resume = false
# With several search terms, also write each term's hits to its own file next to
# the session, named <session>.<term>.jsonl (the term is sanitized for the file
# system). Ignored for a single term. true | false. Default: false.
output-separated = false
# Download every file with hits into a "files" directory next to the session
# (results/files by default), one sub-directory per term (named like the
# output-separated files): files/<term>/<project>_<branch>_<timestamp>_<path>,
# e.g. files/password/acme_api_main_20261117093000_config_settings.py.
# Each hit of a downloaded file gets a "file" key with its local path.
# One API request per file (counted by index-rpm). true | false. Default: false.
download-files = false
# With download-files: skip files larger than this. Bytes or with k, M, G
# (500k, 10M, 1G); 0 = no limit. Default: 10M.
download-max-size = 10M

[postprocess]
# After a finished search, run post-processing on the session file:
#   dedup | convert | dedup,convert (always run in this order). Empty = none.
#   audit.jsonl -> audit.deduped.jsonl -> audit.deduped.converted.json
# The dedup/convert options below apply.
post-process =
# With post-process: keep only the last file and delete the session JSONL and the
# intermediate files (saves space; the session can't be resumed). true | false. Default: false.
final-only = false
# After the search (and post-process), pack the results of the run into <session>.zip
# next to the session, in the same layout: the session, the post-process outputs, the
# output-separated term files and the downloaded files of the session's hits (other
# sessions in the same directory are left out). The original files are kept.
# true | false. Default: false.
to-zip = false

# Used by mode = dedup and mode = convert.
# Input session file and output file.
input-file =
output-file =
# dedup: SQLite file for seen hashes. Empty = <output-file>.seen.sqlite.
sqlite-path =
# dedup: hash algorithm: blake2b | sha1 | sha256. Default: blake2b.
hash-algo = blake2b
# dedup: collapse whitespace before comparing hits: true | false. Default: true.
normalize-hits = true
# convert: sort JSON keys in the output: true | false. Default: false.
sort-keys = false

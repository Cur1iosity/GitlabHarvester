name: demo gif

# Re-record docs/assets/demo.gif when the tool version changes (or the demo
# sources change) on dev, and commit it back to dev. It reaches main with the
# usual dev -> main pull request. See docs/demo/README.md.

on:
  push:
    branches: [dev]
    paths:
      - pyproject.toml
      - gitlab_harvester.py
      - "glh/**"
      - "fakegitlab/**"
      - "docs/demo/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-gif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: record demo GIF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # commit the GIF back to dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the GIF must be re-recorded
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              sh docs/demo/needs-rebuild.sh "" | grep -v '^run=\|^reason='
              echo "run=true"
              echo "reason=manual run"
            } >> "$GITHUB_OUTPUT"
          else
            sh docs/demo/needs-rebuild.sh "${{ github.event.before }}" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Build the recording image
        if: steps.check.outputs.run == 'true'
        run: docker build -f docs/demo/Dockerfile -t gitlab-harvester/demo .

      - name: Record
        if: steps.check.outputs.run == 'true'
        run: docker run --rm -v "$PWD/docs:/vhs" gitlab-harvester/demo demo/demo.tape

      - name: Keep the GIF as a run artifact
        if: steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: demo-gif-${{ steps.check.outputs.version }}
          path: docs/assets/demo.gif

      - name: Commit to dev
        if: steps.check.outputs.run == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/demo.gif
          if git diff --cached --quiet; then
            echo "GIF unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "docs: regenerate demo GIF for v${VERSION}" -m "Recorded by the demo-gif workflow (${REASON})."
          # dev may have moved while recording: rebase onto it and retry a few times.
          for attempt in 1 2 3; do
            git pull --rebase origin dev && git push origin HEAD:dev && exit 0
            sleep $((attempt * 5))
          done
          echo "Could not push the regenerated GIF to dev." >&2
          exit 1

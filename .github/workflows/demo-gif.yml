name: demo gif

# Record the README demo GIF for every published release (or by hand) and
# publish it to the `demo-assets` branch as a single force-pushed commit.
# The README embeds it from there, so dev and main never get bot commits and
# the GIF always shows the version that is on PyPI. See docs/demo/README.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-gif
  cancel-in-progress: true

jobs:
  record:
    name: record and publish the demo GIF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # force-push the demo-assets branch
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: meta
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Build the recording image
        run: docker build -f docs/demo/Dockerfile -t gitlab-harvester/demo .

      - name: Record
        run: docker run --rm -v "$PWD/docs:/vhs" gitlab-harvester/demo demo/demo.tape

      - name: Keep the GIF as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: demo-gif-${{ steps.meta.outputs.version }}
          path: docs/demo/out/demo.gif

      - name: Publish to the demo-assets branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE: ${{ github.ref_name }}
        run: |
          work="$RUNNER_TEMP/demo-assets"
          mkdir -p "$work"
          cp docs/demo/out/demo.gif "$work/demo.gif"
          cat > "$work/README.md" <<EOF
          # demo-assets

          Generated by \`.github/workflows/demo-gif.yml\`: the README demo GIF for
          GitlabHarvester v${VERSION} (recorded from \`${SOURCE}\`).
          This branch is force-pushed on every release; don't commit to it.
          EOF
          cd "$work"
          git init -q -b demo-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo.gif README.md
          git commit -q -m "demo GIF for v${VERSION}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-assets:demo-assets

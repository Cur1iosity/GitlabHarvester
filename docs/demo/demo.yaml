# Fake GitLab scenario for the README demo: two projects with two branches each, so
# the clip is short and every line of the output fits one screen. Artificial data only.
#
# The terms searched in the demo (password, api_key, token; see setup.sh) appear in
# both projects. Their settings files hold what a real finding looks like: a technical
# account and a generated password (artificial: the demo shows them with jq at the end).
name: demo
description: Two projects with artificial secrets, for the README demo.

users:
  - id: 1
    username: harvester-bot
    name: Harvester Bot
    tokens: [dev-token]

projects:
  - id: 101
    path_with_namespace: acme/billing-api
    description: Billing API
    default_branch: main
    visibility: internal
    created_at: "2024-02-01T00:00:00.000Z"
    last_activity_at: "2024-06-10T12:00:00.000Z"
    branches:
      main:
        files:
          config/settings.py: |
            DEBUG = False
            DB_HOST = "db-billing.internal.example"
            DB_USER = "svc_billing"
            DB_PASSWORD = "Xk9#v2Q!m7Lp"
            API_KEY = "FAKE-api-key-0001"
          deploy/.env.example: |
            SERVICE_URL=https://billing.internal.example
            SERVICE_TOKEN=FAKE-service-token-0001
      develop:
        inherit: main
        files:
          scripts/debug.sh: |
            #!/bin/sh
            export API_KEY=FAKE-api-key-dev-0001
            export SERVICE_TOKEN=FAKE-token-dev-0001

  - id: 102
    path_with_namespace: acme/payments-worker
    description: Payments worker
    default_branch: main
    visibility: internal
    created_at: "2024-02-02T00:00:00.000Z"
    last_activity_at: "2024-06-11T12:00:00.000Z"
    branches:
      main:
        files:
          config/settings.py: |
            DEBUG = False
            DB_HOST = "db-payments.internal.example"
            DB_USER = "svc_payments"
            DB_PASSWORD = "Rt4$w8Nq!z3Hc"
            API_KEY = "FAKE-api-key-0002"
          deploy/.env.example: |
            QUEUE_URL=amqp://mq.internal.example
            SERVICE_TOKEN=FAKE-service-token-0002
      develop:
        inherit: main
        files:
          scripts/debug.sh: |
            #!/bin/sh
            export SERVICE_TOKEN=FAKE-token-dev-0002

# 2 projects x 2 branches x 3 terms is 12 searches: a small delay keeps the live
# status panel on screen for a few seconds instead of a blink. Tune it, and the
# final Sleep in demo.tape, if the recorded GIF runs too long or too short.
faults:
  - name: demo-search-latency
    match: {method: GET, path: "/search$"}
    response: {delay: 0.35}
  - name: demo-branches-latency
    match: {method: GET, path: "/repository/branches$"}
    response: {delay: 0.3}

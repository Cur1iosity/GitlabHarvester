[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-harvester"
version = "1.0.1"
description = "Build a GitLab instance project index and search repositories for sensitive keywords (API-only, no cloning)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Cur1iosity", email = "cur1iosity@protonmail.com" }
]

keywords = [
  "gitlab",
  "gitlab-api",
  "code-search",
  "secret-scanning",
  "secret-detection",
  "credential-leak",
  "leak-detection",
  "security-audit",
  "devsecops",
  "pentest",
  "red-team",
  "redteam",
  "osint",
  "recon",
  "compliance",
  "cli",
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Utilities",
  "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
  "python-gitlab>=8.0.0",
  "requests>=2.32.0",  # python-gitlab 8.x requires it
]

[project.optional-dependencies]
# Development/test tooling. Exact versions used in CI live in requirements-dev.txt.
test = [
  "pytest>=8.0",
  "pytest-httpserver>=1.1.0",
  "PyYAML>=6.0",
  "trustme>=1.0",
]

[project.urls]
Homepage = "https://github.com/Cur1iosity/GitlabHarvester"
Repository = "https://github.com/Cur1iosity/GitlabHarvester"
Issues = "https://github.com/Cur1iosity/GitlabHarvester/issues"
Documentation = "https://github.com/Cur1iosity/GitlabHarvester#readme"
Changelog = "https://github.com/Cur1iosity/GitlabHarvester/releases"

[tool.setuptools]
py-modules = ["gitlab_harvester"]

[tool.setuptools.package-data]
glh = ["py.typed"]

[tool.setuptools.packages.find]
include = ["glh*"]

[project.scripts]
gitlab-harvester = "gitlab_harvester:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Repository root on sys.path so tests can import the fakegitlab dev package.
pythonpath = ["."]
# Contract tests talk to a real GitLab and are opt-in: pytest -m contract
addopts = "-ra --strict-markers -m 'not contract'"
markers = [
  "unit: isolated tests without HTTP (tests/unit, tests/fakeserver)",
  "integration: real python-gitlab against the Fake GitLab (tests/integration)",
  "e2e: CLI subprocess against the Fake GitLab (tests/e2e)",
  "contract: optional checks against a real GitLab instance (tests/contract)",
  "scenario(name): Fake GitLab scenario to load for the test",
]
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
]
